# Perfil de desenvolvimento: H2 em memoria, sem precisar de banco instalado.
spring.datasource.url=jdbc:h2:mem:mapdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Em dev o H2 e recriado do zero a cada execucao pelo proprio Hibernate, entao as
# migracoes do Flyway (escritas em SQL do MySQL) nao sao aplicadas aqui.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
