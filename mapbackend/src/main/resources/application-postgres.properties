# Perfil de producao com PostgreSQL.
#
# Mesma aplicacao do perfil prod, outro banco. Existe porque os servicos que
# hospedam banco de graca (Render, Neon, Supabase) oferecem PostgreSQL, e sem um
# banco que persista toda conta criada e toda avaliacao enviada sumiriam no
# proximo reinicio - foi o preco do perfil demo, que roda em H2 na memoria.
#
# Variaveis de ambiente que a hospedagem precisa definir:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://HOST/BANCO
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SMARTPARK_JWT_SECRET        obrigatoria: sem ela a aplicacao recusa subir
#   SMARTPARK_ADMIN_SENHA       sem ela o administrador inicial nao e criado
#   SMARTPARK_CORS_ORIGENS      dominio do site publicado
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# O esquema e criado e alterado pelas migracoes versionadas no Git. O diretorio e
# escolhido aqui porque os scripts de MySQL e de PostgreSQL descrevem o mesmo
# modelo em dialetos diferentes, e misturar os dois quebraria os dois.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql

# O Hibernate nao altera nada: apenas confere se as entidades batem com o banco.
# Se divergirem, a aplicacao nao sobe e aponta a diferenca. E este o teste de que
# a migracao acima esta correta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# O plano gratuito do banco costuma ter poucas conexoes. Um pool pequeno evita
# que a aplicacao consuma o limite sozinha e deixe as migracoes sem conexao.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Este perfil roda exposto na internet: o console de banco fica desligado.
spring.h2.console.enabled=false
