spring.application.name=mapbackend

# Servicos de hospedagem (Render, Railway, Cloud Run) informam a porta pela
# variavel PORT e roteiam o trafego para ela. Sem isto o servico sobe, mas
# fica inalcancavel: a plataforma bate em uma porta e a aplicacao escuta outra.
server.port=${PORT:8080}

# Perfil padrao: dev (H2 em memoria). Para MySQL use: --spring.profiles.active=prod
spring.profiles.active=dev

# Origens liberadas para o front-end.
#
# Em desenvolvimento: o Vite (5173) e o preview do build (4173).
# O dominio publicado na Vercel ja vem na lista padrao. Para trocar ou
# acrescentar outro, defina SMARTPARK_CORS_ORIGENS separando por virgula.
# Sem isso o navegador bloqueia toda chamada vinda do site publicado.
smartpark.cors.origens=${SMARTPARK_CORS_ORIGENS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,https://smart-park-eight-puce.vercel.app}

# Popula o banco com categorias, pontos e eventos quando ele esta vazio
smartpark.carga-inicial=true

spring.jackson.serialization.write-dates-as-timestamps=false

# --- Seguranca (RNF03) ---
# Segredo da assinatura do JWT. Em producao, defina a variavel de ambiente
# SMARTPARK_JWT_SECRET com pelo menos 32 caracteres. Sem ela, o perfil prod
# se recusa a subir, para nao assinar tokens com um segredo publico.
smartpark.jwt.segredo=${SMARTPARK_JWT_SECRET:}
smartpark.jwt.duracao-minutos=120

# Senha do administrador criado na carga inicial. Em prod e demo, sem esta
# variavel a conta nao e criada: a senha padrao esta no repositorio publico.
smartpark.admin.senha=${SMARTPARK_ADMIN_SENHA:smartpark2026}

# Trava o login apos tentativas seguidas com senha errada
smartpark.login.max-tentativas=5
smartpark.login.bloqueio-minutos=15
