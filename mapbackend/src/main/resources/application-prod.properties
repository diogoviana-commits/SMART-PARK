# Perfil de producao/homologacao: MySQL, conforme documentado no PE.
spring.datasource.url=jdbc:mysql://localhost:3306/mapdb?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O esquema e criado e alterado pelas migracoes versionadas no Git. O diretorio e
# escolhido aqui porque os scripts de MySQL e de PostgreSQL descrevem o mesmo
# modelo em dialetos diferentes, e misturar os dois quebraria os dois.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/mysql

# O Hibernate nao altera nada: apenas confere se as entidades batem com o banco.
# Se divergirem, a aplicacao nao sobe e aponta a diferenca.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
