# Perfil de demonstracao: para publicar a API sem contratar banco nenhum.
#
# Usa H2 em memoria com a carga inicial, entao a API sobe completa e sozinha.
# O preco: tudo que for cadastrado (contas, avaliacoes, progresso) some quando
# o servico reinicia. Para dados que persistem, use o perfil prod com MySQL.
spring.datasource.url=jdbc:h2:mem:mapdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# As migracoes do Flyway sao escritas em SQL do MySQL e nao rodam no H2.
spring.flyway.enabled=false

# Diferente do perfil dev: aqui o console do banco fica DESLIGADO, porque este
# perfil roda exposto na internet e o console daria acesso direto aos dados.
spring.h2.console.enabled=false
