# Abre pull requests semanais atualizando as dependências. Antes de juntar um
# deles, baixe o ramo e rode `npm run verificar`: não há mais testes automáticos
# no GitHub. As atualizações pequenas vêm agrupadas em um PR só, para não encher
# a lista.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
