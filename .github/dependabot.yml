# Abre pull requests semanais atualizando as dependências. Cada PR passa pelo
# fluxo de Testes antes de ser juntado. As atualizações pequenas vêm agrupadas
# em um PR só, para não encher a lista.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
