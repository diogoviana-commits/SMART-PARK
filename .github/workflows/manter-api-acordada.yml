# Mantém a API acordada.
#
# O plano gratuito da Render hiberna o serviço após 15 minutos sem acesso, e
# acordar leva de um a alguns minutos — o que estragaria uma apresentação. Este
# fluxo pede uma chamada a cada 10 minutos para o serviço não ficar ocioso
# tempo suficiente para dormir (veja abaixo por que isso nem sempre acontece).
#
# Cabe no plano gratuito: são 750 horas de instância por mês e o mês tem ~730,
# então um único serviço ligado o tempo todo continua sem custo.
#
# Para ligar: defina a variável API_URL em
# Settings > Secrets and variables > Actions > Variables,
# com o endereço da API, por exemplo https://smartpark-api.onrender.com
# Sem essa variável o fluxo não faz nada, em vez de falhar.

name: Manter a API acordada

on:
  schedule:
    # A cada 10 minutos, em teoria. Na prática o GitHub segura os agendamentos
    # e os disparos saem com horas de intervalo, então isto não garante que a
    # API fique acordada. Antes de uma apresentação, dispare na mão.
    - cron: '*/10 * * * *'
  workflow_dispatch: # permite disparar na mão antes de uma apresentação

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "A variável API_URL não está definida. Nada a fazer."
            exit 0
          fi

          # O GitHub atrasa os disparos agendados em horas, então quase sempre
          # o serviço já hibernou e esta chamada é a que o acorda. Subir o
          # Spring Boot na Render gratuita pode passar de 2 minutos, por isso
          # tenta várias vezes em vez de desistir no primeiro tempo esgotado.
          # O "|| true" impede que o timeout do curl (código 28) derrube o
          # passo, já que o bash roda com -e.
          for tentativa in 1 2 3 4 5; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
              "$API_URL/api/categorias" || true)

            echo "Tentativa $tentativa: GET $API_URL/api/categorias -> HTTP $codigo"

            if [ "$codigo" = "200" ]; then
              exit 0
            fi

            sleep 15
          done

          echo "::error::A API não respondeu 200 depois de 5 tentativas."
          exit 1
