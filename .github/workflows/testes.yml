# Roda os testes da API, confere os tipos e compila o site a cada push e pull request.
#
# A Vercel publica direto da main, então um commit quebrado vai para o ar sem
# aviso. Este fluxo marca o commit com ❌ quando algo quebra, e nos pull requests
# (inclusive os do Dependabot) mostra o resultado antes de juntar.

name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: API e site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir os tipos
        run: npm run tipos

      # Os testes sobem um PostgreSQL embutido (PGlite): não precisam de banco externo.
      - name: Testes da API
        run: npm test

      # O mesmo comando que a Vercel usa (veja vercel.json).
      - name: Compilar o site
        run: npm run build
